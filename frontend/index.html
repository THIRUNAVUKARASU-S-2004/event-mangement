<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card" id="auth-card">
            <h1 id="form-title">Login</h1>
            <p id="message" class="message"></p>

            <form id="auth-form">
                <div class="input-group register-only hidden">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" minlength="3" maxlength="100">
                </div>

                <div class="input-group register-only hidden">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Your age" min="16">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" id="submit-btn">Login</button>
            </form>

            <p class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span>
                <a href="#" id="toggle-link">Register</a>
            </p>
        </div>

        <div class="card hidden" id="home-card">
            <h1>Welcome</h1>
            <p id="user-email" class="user-email"></p>
            <p id="home-message" class="message"></p>
            <button type="button" id="logout-btn" class="logout-btn">Logout</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
